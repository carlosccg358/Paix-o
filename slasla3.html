<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Nomes</title>
    <link rel="stylesheet" href="sla2.css">
</head>
<body>
    <form action="/enviar-dados" method="POST">
  <div>
    <label for="nome">Nome:</label>
    <input type="text" id="User" name="User" placeholder="Digite seu User name" required>
  </div>

  <div>
    <label for="senha">Senha</label>
    <input type="senha" id="senha" name="senha" placeholder="1234" required>
  </div>
  <button type="submit">Enviar</button>
</form>

</body>
</html>
